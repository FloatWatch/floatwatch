services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      FRONTEND_ORIGIN: http://localhost:3000
    volumes:
      - backend-data:/app/data
      - backend-storage:/app/storage
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  backend-data:
  backend-storage:
